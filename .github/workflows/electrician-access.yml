name: Vérifier les accès Électricité (mobile)
on:
  push:
    branches:
      - preview/effectif-mobile-rh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier l'isolation des métiers et les droits des électriciens
        run: node --test tests/electrician_access.test.mjs
