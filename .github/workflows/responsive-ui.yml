name: Vérifier responsive PC et mobile
on:
  push:
    branches:
      - preview/responsive-pc-mobile
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Dépendances et compilation
        run: |
          npm ci
          npm run build
      - name: Vérifier les fichiers Excel et les autorisations administrateur
        run: node --test tests/excel.test.mjs
      - name: Installer Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Vérifier 360, 390, 768 et 1366 pixels
        run: |
          npm run build
          npx vite preview --config client/vite.config.js --host 127.0.0.1 --port 4173 > /tmp/engineering-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/responsive.spec.mjs --workers=1 --reporter=line
