name: Statistiques Masterclass - responsive et securite
on:
  push:
    branches:
      - preview/statistiques-masterclass
  workflow_dispatch:
permissions:
  contents: read
jobs:
  statistiques:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Installation et compilation Vite
        run: |
          npm ci
          npm run build
      - name: Securite, Excel et Parametres
        run: |
          node --test tests/settings-admin.test.mjs tests/excel.test.mjs tests/electrician_access.test.mjs
      - name: Installer le navigateur Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Test des neuf modules et des statistiques 360 390 768 1366 px
        run: |
          npx vite preview --config client/vite.config.js --host 127.0.0.1 --port 4173 > /tmp/engineering-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/responsive.spec.mjs --workers=1 --reporter=line
