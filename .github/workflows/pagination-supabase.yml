name: Supabase - chargement complet des historiques
on:
  push:
    branches:
      - preview/supabase-pagination-complete
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Installer et compiler
        run: |
          npm ci
          npm run build
      - name: Vérifier pagination PM et Operating Time
        run: node --test tests/pagination.test.mjs
      - name: Vérifier sécurité, Excel et paramètres
        run: node --test tests/settings-admin.test.mjs tests/excel.test.mjs tests/electrician_access.test.mjs
      - name: Installer Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Vérifier les neuf modules sur PC et mobile
        run: |
          npx vite preview --config client/vite.config.js --host 127.0.0.1 --port 4173 >/tmp/engineering-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/responsive.spec.mjs tests/i18n.spec.mjs --workers=1 --reporter=line
