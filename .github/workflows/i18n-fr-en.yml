name: Vérifier bilingue français anglais sur PC et mobile
on:
  push:
    branches:
      - preview/bilingue-fr-en-complet
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bilingual:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Construire Engineering Mobile
        run: |
          npm ci
          npm run build
      - name: Préserver les contrôles de sécurité et Excel
        run: |
          node --test tests/settings-admin.test.mjs tests/excel.test.mjs tests/electrician_access.test.mjs
      - name: Installer Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Vérifier FR/EN sur neuf modules et trois types d'écran
        run: |
          npx vite preview --config client/vite.config.js --host 127.0.0.1 --port 4173 >/tmp/engineering-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/i18n.spec.mjs --workers=1 --reporter=line
      - name: Vérifier responsive et anciennes fonctions
        run: npx playwright test tests/responsive.spec.mjs --workers=1 --reporter=line
